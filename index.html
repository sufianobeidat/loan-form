<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقييم أهلية القرض</title>
<style>
:root{--blue:#0B5FA5;--dark:#0B3D66;--bg:#EFF5FC;--card:#fff;--border:#D3E3F5;--text:#122B45;--muted:#5A7A9A;--green:#2E7D5B;--amber:#B8842E;--red:#C1440E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A2A;--card:#122B45;--border:#1E3A57;--text:#EAF3FC;--muted:#8FB3D6}}
:root[data-theme="dark"]{--bg:#0B1A2A;--card:#122B45;--border:#1E3A57;--text:#EAF3FC;--muted:#8FB3D6}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100%}
.hd{background:var(--dark);padding:16px;text-align:center}
.hd b{color:#fff;font-size:17px;display:block}
.hd span{color:#BBD6EF;font-size:11px}
.ft{background:var(--dark);padding:10px;text-align:center;color:#EAF3FC;font-size:12px;font-weight:600}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 30px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px}
.lbl{color:var(--muted);font-size:12px;font-weight:600;margin-bottom:6px}
h1{font-size:22px;margin:4px 0 20px}
h2{font-size:17px;margin:0 0 16px}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar>i{display:block;height:100%;background:var(--blue);transition:.3s}
.opt{display:block;width:100%;text-align:right;padding:13px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;margin-bottom:8px;cursor:pointer}
.opt.sel{border:2px solid var(--blue);background:rgba(11,95,165,.1);color:var(--blue);font-weight:700}
input[type=number]{width:100%;border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:16px;margin-bottom:12px;background:var(--card);color:var(--text)}
.btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:14px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--blue)}
.btn.dark{background:var(--dark)}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.row b{color:var(--blue)}
.back{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;margin-top:10px}
.note{background:#FBF1DF;border:1px solid #E3C98A;border-radius:16px;padding:16px;font-size:13px;color:#5A4622;margin-bottom:14px}
.actions{display:flex;gap:8px;margin-bottom:12px}
.actions .btn{flex:1;font-size:13px;padding:11px;display:flex;align-items:center;justify-content:center;gap:6px}
.tiny{font-size:11px;color:var(--muted);text-align:center;line-height:1.6;margin-bottom:14px}
</style>
</head>
<body>
<div class="hd"><b>مصرف أبوظبي الإسلامي</b><span>Abu Dhabi Islamic Bank</span></div>
<div class="wrap" id="app"></div>
<div class="ft">الموظف: سفيان عبيدات</div>
<script>
const AGENT_WHATSAPP = "971566433877";
const AGENT_PAGE = "https://claude.ai/artifact/QSxtJw1VEqrQ3iYp6SnTkh";

const QUESTIONS=[
{k:"name",t:"الاسم الثلاثي",txt:1,ph:"مثال: محمد أحمد علي"},
{k:"phone",t:"رقم الهاتف",txt:1,ph:"مثال: 0501234567"},
{k:"emirate",t:"الإمارة التي تسكن بها",o:[["ابوظبي","أبوظبي"],["دبي","دبي"],["الشارقة","الشارقة"],["عجمان","عجمان"],["ام القيوين","أم القيوين"],["رأس الخيمة","رأس الخيمة"],["الفجيرة","الفجيرة"]]},
{k:"nationality",t:"الجنسية",o:[["citizen","مواطن إماراتي"],["expat","مقيم (أجنبي)"]]},
{k:"age",t:"الفئة العمرية",o:[["21-30","21-30 سنة"],["31-45","31-45 سنة"],["46-60","46-60 سنة"],["60+","أكثر من 60"]]},
{k:"marital",t:"الحالة الاجتماعية",o:[["single","أعزب"],["married","متزوج"]]},
{k:"children",t:"عدد الأبناء",skip:a=>a.marital==="single",o:[["0","لا يوجد"],["1-2","1-2"],["3-4","3-4"],["5+","5 أو أكثر"]]},
{k:"kidsSchool",t:"كم منهم بالمدرسة؟",skip:a=>a.marital==="single"||a.children==="0",o:[["0","لا يوجد"],["1","واحد"],["2","اثنان"],["3+","3 أو أكثر"]]},
{k:"kidsUni",t:"كم منهم بالجامعة؟",skip:a=>a.marital==="single"||a.children==="0",o:[["0","لا يوجد"],["1","واحد"],["2","اثنان"],["3+","3 أو أكثر"]]},
{k:"employment",t:"طبيعة العمل",o:[["gov","قطاع حكومي"],["private","قطاع خاص"],["business","عمل حر / مشروع"]]},
{k:"tenure",t:"مدة الخدمة الحالية",o:[["<6m","أقل من 6 أشهر"],["6-24m","6 أشهر-سنتين"],[">24m","أكثر من سنتين"]]},
{k:"hasCards",t:"هل يوجد لديك بطاقات (دبت أو كريدت)؟",o:[["yes","نعم"],["no","لا"]]},
{k:"cardsCount",t:"كم عددها؟",skip:a=>a.hasCards!=="yes",o:[["1","1"],["2","2"],["3","3"],["4+","4 أو أكثر"]]},
{k:"income",t:"الدخل الشهري الصافي (درهم)",num:1,ph:"مثال: 12000"},
{k:"obligations",t:"إجمالي الالتزامات الشهرية (درهم)",num:1,ph:"مثال: 2000 (اكتب 0 إذا لا يوجد)"},
{k:"otherBankLoan",t:"هل لديك قرض حاليًا في بنك آخر؟",o:[["yes","نعم"],["no","لا"]]},
{k:"otherBankPaid",t:"كم دفعة القرض الشهرية؟ (درهم)",skip:a=>a.otherBankLoan!=="yes",num:1,ph:"مثال: 1500"},
{k:"buyoutInterest",t:"هل أنت مهتم بـ:",o:[["buyout","شراء مديونية"],["new","أخذ قرض جديد"],["no","غير مهتم حاليًا"]]},
{k:"purpose",t:"الغرض من القرض",o:[["car","سيارة"],["home","سكن/تجديد منزل"],["business","توسعة مشروع"],["personal","احتياج شخصي/تعليم"]]},
{k:"importance",t:"أهمية القرض أو البطاقة لديك في هذا الوقت",o:[["normal","عادي"],["important","مهم"],["urgent","مهم جدًا"]]},
{k:"contactTime",t:"الوقت المناسب للتواصل معك",o:[["morning","صباحًا"],["noon","ظهرًا"],["evening","مساءً"]]},
{k:"contactDays",t:"الأيام المناسبة للتواصل",o:[["weekdays","أيام الأسبوع (أحد-خميس)"],["weekend","نهاية الأسبوع (جمعة-سبت)"],["any","أي يوم مناسب"]]},
];

function fmt(n){return Math.round(n).toLocaleString("en-US")}

function evaluate(a){
const inc=parseFloat(a.income)||0, obl=parseFloat(a.obligations)||0;
const dbr= inc>0? (obl/inc*100):100;
const maxInst=Math.max(inc*0.5-obl,0), rem=inc-obl;
const tenure={"<6m":0,"6-24m":1,">24m":2}[a.tenure];
const uni=a.kidsUni&&a.kidsUni!=="0"?(a.kidsUni==="3+"?3:+a.kidsUni):0;
const sch=a.kidsSchool&&a.kidsSchool!=="0"?(a.kidsSchool==="3+"?3:+a.kidsSchool):0;
const edu=uni*2+sch;
let elig="متوسطة",color="var(--amber)";
if(dbr<=30&&tenure>=1&&inc>=5000&&edu<=2){elig="عالية";color="var(--green)"}
else if(dbr>=50||inc<3000||(a.employment!=="gov"&&tenure===0)||(edu>=5&&inc<15000)){elig="تحتاج مراجعة إضافية";color="var(--red)"}
let loan="قرض شخصي عام";
if(a.purpose==="car")loan="تمويل سيارة";else if(a.purpose==="home")loan="تمويل سكني";else if(a.purpose==="business")loan="تمويل أعمال";
const tips=[];
tips.push(`نسبة الالتزامات إلى الدخل: ${dbr.toFixed(1)}% (القاعدة: ألا تتجاوز 50%)`);
tips.push(`الحد الأقصى لقسط جديد: ${fmt(maxInst)} درهم شهريًا`);
tips.push(`صافي الدخل المتبقي حاليًا: ${fmt(rem)} درهم`);
if(dbr>=40)tips.push("الالتزامات مرتفعة — يُفضّل مدة سداد أطول لتقليل القسط");
else tips.push("وضع الالتزامات مريح — مرونة أكبر باختيار مدة أقصر");
if(a.marital==="married")tips.push("ناقش خطة السداد مع شريك الحياة قبل الالتزام");
if(uni>0)tips.push(`${a.kidsUni==="3+"?"3+":a.kidsUni} من الأبناء بالجامعة — احسب رسومها ضمن الالتزامات الثابتة`);
if(sch>0)tips.push(`${a.kidsSchool==="3+"?"3+":a.kidsSchool} من الأبناء بالمدرسة — ضع رسومها الموسمية بالحسبان`);
return{elig,color,loan,tips,n:{income:fmt(inc),obligations:fmt(obl),dbr:dbr.toFixed(1),maxInst:fmt(maxInst),rem:fmt(rem)}};
}

// ---------- Customer flow ----------
let step=0, answers={};
function active(){return QUESTIONS.filter(q=>!q.skip||!q.skip(answers))}
function render(){
const app=document.getElementById("app");
const act=active(), q=act[step];
if(!q){renderThanks();return}
const idx=act.findIndex(x=>x.k===q.k), pct=Math.round(idx/act.length*100);
let html=`<div class="lbl">تقييم أهلية القرض</div><h1>امتحان سريع لتحديد أنسب قرض إلك</h1>
<div class="bar"><i style="width:${pct}%"></i></div>
<div class="card"><div class="lbl">سؤال ${idx+1} من ${act.length}</div><h2>${q.t}</h2>`;
if(q.num||q.txt){
html+=`<input type="${q.num?'number':'text'}" ${q.num?'inputmode="decimal"':''} id="numIn" placeholder="${q.ph}" value="${answers[q.k]||''}">
<button class="btn" id="numBtn">التالي</button>`;
}else{
q.o.forEach(([v,l])=>{
const sel=answers[q.k]===v;
html+=`<button class="opt ${sel?'sel':''}" data-v="${v}">${l}</button>`;
});
}
if(step>0)html+=`<button class="back" id="backBtn">‹ رجوع</button>`;
html+="</div>";
app.innerHTML=html;
if(q.num||q.txt){
document.getElementById("numBtn").onclick=()=>{
const v=document.getElementById("numIn").value.trim();
if(v!==""&&(q.txt||!isNaN(v)))select(q.k,v);
};
}else{
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>select(q.k,b.dataset.v));
}
if(step>0)document.getElementById("backBtn").onclick=()=>{step--;render()};
}
function select(k,v){
answers[k]=v;
setTimeout(()=>{step++;render()},120);
}
function renderThanks(){
const app=document.getElementById("app");
const leadId="l"+Date.now()+Math.random().toString(36).slice(2,7);
const data=Object.assign({id:leadId,ts:Date.now()},answers);
const payload=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
const link=AGENT_PAGE+"#lead="+payload;
const msg="📋 عميل جديد: "+(answers.name||"")+"\nاضغط لعرض التفاصيل الكاملة:\n"+link;
const wa="https://wa.me/"+AGENT_WHATSAPP+"?text="+encodeURIComponent(msg);
app.innerHTML=`
<div class="card">
<h2>✅ تم استلام بياناتك</h2>
<p style="font-size:14px;line-height:1.7">شكرًا لك على وقتك أستاذ ${answers.name||""} 🌿 حابين نطمنك: هالتقييم هو استشارة مالية بسيطة الهدف منها بس نوضحلك خياراتك بشكل واضح وصادق — والقرار الأخير، بكل تفاصيله، إلك إنت وحدك، بدون أي إلزام أو ضغط من طرفنا.</p>
<p style="font-size:14px;line-height:1.7">الموظف المختص بيراجع وضعك بعناية الآن ليجهزلك أفضل خيار يناسبك تمامًا، وسوف يتم التواصل معك قريبًا بالوقت اللي حددته لمناقشة التفاصيل معك مباشرة.</p>
</div>
<div class="tiny">لإكمال إرسال طلبك، اضغط الزر بالأسفل</div>
<a class="btn" id="sendBtn" href="${wa}" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">📤 إرسال الطلب للموظف</a>
<div style="height:8px"></div>
<button class="btn ghost" id="copyLinkBtn">📋 أو انسخ الرابط يدويًا</button>
<div class="tiny" id="copyMsg2"></div>`;
document.getElementById("copyLinkBtn").onclick=async()=>{
try{await navigator.clipboard.writeText(wa);document.getElementById("copyMsg2").textContent="تم النسخ — الصقه بمحادثة واتساب ✓"}
catch(e){document.getElementById("copyMsg2").textContent="تعذر النسخ"}
};
}

// ---------- Agent flow ----------
function renderAgent(payload){
const app=document.getElementById("app");
let a;
try{a=JSON.parse(decodeURIComponent(escape(atob(payload))))}catch(e){app.innerHTML="<div class='card'>رابط غير صالح</div>";return}
const r=evaluate(a);
app.innerHTML=`
<div class="lbl">عرض خاص — الموظف فقط</div><h1>نتيجة تقييم العميل</h1>
<div class="card">
<div class="lbl">فرصة الأهلية</div>
<h2 style="color:${r.color}">${r.elig}</h2>
<div class="lbl">نوع القرض الأنسب</div>
<div style="font-weight:700;font-size:16px">${r.loan}</div>
</div>
<div class="card">
<div style="font-weight:700;margin-bottom:10px">التفاصيل المالية بالأرقام</div>
<div class="row"><span>الدخل الشهري</span><b>${r.n.income} درهم</b></div>
<div class="row"><span>الالتزامات الحالية</span><b>${r.n.obligations} درهم</b></div>
<div class="row"><span>نسبة الالتزامات (DBR)</span><b>${r.n.dbr}%</b></div>
<div class="row"><span>صافي الدخل المتبقي</span><b>${r.n.rem} درهم</b></div>
<div class="row" style="border:none"><span>الحد الأقصى لقسط جديد</span><b>${r.n.maxInst} د/شهر</b></div>
</div>
<div class="card">
<div style="font-weight:700;margin-bottom:10px">نصائح إدارة الميزانية</div>
${r.tips.map(t=>`<div style="font-size:13px;line-height:1.6;padding-right:10px;border-right:3px solid var(--blue);margin-bottom:8px">${t}</div>`).join("")}
</div>
<div class="note">⚠ أي قرارات استثمارية تحتاج مستشار مالي مرخّص — منفصلة عن خدمة القرض.</div>
<div class="actions">
<button class="btn ghost" id="printBtn">🖨 طباعة</button>
<button class="btn ghost" id="copyBtn">📋 نسخ</button>
<button class="btn" id="shareBtn">📤 صورة لواتساب</button>
</div>
<div class="tiny" id="msg"></div>`;
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("copyBtn").onclick=async()=>{
const text=`مصرف أبوظبي الإسلامي — تقييم أهلية القرض\nفرصة الأهلية: ${r.elig}\nنوع القرض: ${r.loan}\nالدخل: ${r.n.income} درهم\nالالتزامات: ${r.n.obligations} درهم\nDBR: ${r.n.dbr}%\nصافي المتبقي: ${r.n.rem} درهم\nالحد الأقصى لقسط جديد: ${r.n.maxInst} درهم/شهر\n\nالموظف: سفيان عبيدات`;
try{await navigator.clipboard.writeText(text);document.getElementById("msg").textContent="تم النسخ ✓"}catch(e){document.getElementById("msg").textContent="تعذر النسخ"}
setTimeout(()=>document.getElementById("msg").textContent="",2000);
};
document.getElementById("shareBtn").onclick=()=>shareImg(r);
}

function shareImg(r){
const W=640,H=760,c=document.createElement("canvas");c.width=W;c.height=H;
const ctx=c.getContext("2d");
ctx.fillStyle="#EFF5FC";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#0B3D66";ctx.fillRect(0,0,W,70);
ctx.fillStyle="#fff";ctx.font="bold 22px Tahoma";ctx.textAlign="center";ctx.direction="rtl";
ctx.fillText("مصرف أبوظبي الإسلامي",W/2,32);
ctx.font="12px Tahoma";ctx.fillStyle="#BBD6EF";ctx.fillText("Abu Dhabi Islamic Bank",W/2,52);
let y=110;ctx.textAlign="right";
function card(h){ctx.fillStyle="#fff";ctx.strokeStyle="#D3E3F5";rr(30,y,W-60,h,12)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();ctx.stroke()}
card(90);
ctx.fillStyle="#5A7A9A";ctx.font="13px Tahoma";ctx.fillText("نتيجة التقييم الأولي",W-50,y+26);
ctx.fillStyle=r.color.replace("var(--green)","#2E7D5B").replace("var(--amber)","#B8842E").replace("var(--red)","#C1440E");
ctx.font="bold 20px Tahoma";ctx.fillText("فرصة أهلية "+r.elig,W-50,y+55);
ctx.fillStyle="#122B45";ctx.font="bold 16px Tahoma";ctx.fillText(r.loan,W-50,y+78);
y+=105;
const rows=[["الدخل الشهري",r.n.income+" درهم"],["الالتزامات",r.n.obligations+" درهم"],["نسبة DBR",r.n.dbr+"%"],["صافي المتبقي",r.n.rem+" درهم"],["حد القسط الجديد",r.n.maxInst+" د/شهر"]];
const nh=40+rows.length*32;card(nh);
ctx.fillStyle="#122B45";ctx.font="bold 14px Tahoma";ctx.fillText("التفاصيل المالية بالأرقام",W-50,y+26);
let ry=y+55;
rows.forEach(([l,v])=>{
ctx.fillStyle="#4A6580";ctx.font="13px Tahoma";ctx.fillText(l,W-50,ry);
ctx.fillStyle="#0B5FA5";ctx.font="bold 13px Tahoma";ctx.textAlign="left";ctx.fillText(v,50,ry);ctx.textAlign="right";
ry+=32;
});
y+=nh+25;
ctx.fillStyle="#0B3D66";ctx.fillRect(0,H-40,W,40);
ctx.fillStyle="#EAF3FC";ctx.font="bold 13px Tahoma";ctx.textAlign="center";
ctx.fillText("الموظف: سفيان عبيدات",W/2,H-15);
c.toBlob(async b=>{
const file=new File([b],"تقييم-قرض.png",{type:"image/png"});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
try{await navigator.share({files:[file],title:"تقييم أهلية القرض"});return}catch(e){}
}
const url=URL.createObjectURL(b);const a2=document.createElement("a");a2.href=url;a2.download="تقييم-قرض.png";a2.click();URL.revokeObjectURL(url);
},"image/png");
}

function boot(){
const h=location.hash;
if(h.startsWith("#agent=")){renderAgent(h.slice(7))}
else{render()}
}
window.onhashchange=boot;
boot();
</script>
</body>
</html>
